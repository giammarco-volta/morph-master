<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="240" viewBox="-20 0 1200 240"
     role="img" aria-labelledby="title desc">
  <title id="title">NaadaLab wordmark — common circular template</title>
  <desc id="desc">
    Lowercase naadalab wordmark constructed from a shared circular template.
  </desc>

  <!--
    COMMON GEOMETRY

    Every rounded body uses the same circle:

      centre:     (55, 135) in each letter's local coordinates
      radius:      55
      top tangent: y = 80
      bottom:      y = 190
      leftmost:    x = 0
      rightmost:   x = 110

    Ascenders of d, l and b:
      top: y = 40

    Stroke width:
      18

    The four a letters reuse exactly the same path.
  -->

  <defs>
    <!--
      n:
      two vertical sides joined by the upper semicircle
      of the same 55-unit circular template.
    -->
    <path id="letter-n"
          d="M 0 190
             L 0 135
             A 55 55 0 0 1 110 135
             L 110 190"/>

    <!--
      a:
      starts at the lower end of the right-hand vertical;
      rises to the circle's rightmost point;
      then follows almost the whole circle counter-clockwise,
      stopping shortly before closing at the lower right.
    -->
    <path id="letter-a"
          d="M 110 190
             L 110 135
             A 55 55 0 1 0 55 190
			 L 72 190"/>

    <!--
      d:
      tall right upright; from the circle's rightmost point
      it follows the lower, left and upper portions of the same circle,
      stopping shortly before returning to the upright.
    -->
    <path id="letter-d"
          d="M 110 40
             L 110 135
             A 55 55 0 1 1 55 80
			 L 72 80"/>

    <!-- l: same total height as the ascenders of d and b. -->
    <path id="letter-l"
          d="M 0 40
             L 0 190"/>

    <!--
      b:
      mirror construction of d around the vertical centre of the circle.
    -->
    <path id="letter-b"
          d="M 0 40
             L 0 135
             A 55 55 0 1 0 55 80
			 L 38 80"/>

    <!--
      LETTER PLACEMENT
      Adjust only the first number in translate(x 0)
      to change horizontal spacing.
    -->
    <g id="wordmark-geometry">
      <use href="#letter-n" transform="translate(0 0)"/>
      <use href="#letter-a" transform="translate(150 0)"/>
      <use href="#letter-a" transform="translate(300 0)"/>
      <use href="#letter-d" transform="translate(450 0)"/>
      <use href="#letter-a" transform="translate(600 0)"/>
      <use href="#letter-l" transform="translate(750 0)"/>
      <use href="#letter-a" transform="translate(790 0)"/>
      <use href="#letter-b" transform="translate(940 0)"/>
    </g>

    <linearGradient id="gold"
                    gradientUnits="userSpaceOnUse"
                    x1="0" y1="40" x2="1140" y2="195">
      <stop offset="0" stop-color="#ffc44f"/>
      <stop offset="0.48" stop-color="#ffad24"/>
      <stop offset="1" stop-color="#ed8e0a"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6"
                    flood-color="#000814" flood-opacity="0.38"/>
    </filter>
  </defs>

  <use href="#wordmark-geometry"
       fill="none"
       stroke="url(#gold)"
       stroke-width="30"
       stroke-linecap="round"
       stroke-linejoin="round"
	   filter="url(#softShadow)"/>
</svg>
